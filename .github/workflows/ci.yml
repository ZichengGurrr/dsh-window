name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
